:root{--bg:#0c0c0d;--fg:#f2f0e8;--dim:#6a6a6e;--line:#2b2b2f;--or:#ff4d14;--bl:#2f6bff;--gr:#17c27a;--wh:#f2f0e8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
body{display:flex;align-items:flex-start;justify-content:center}
#app{position:relative;width:240px;height:282px;background:var(--bg);color:var(--fg);font:11px/1 "Departure Mono",monospace;overflow:hidden;-webkit-font-smoothing:none}

/* header */
#hd{height:20px;display:flex;align-items:center;padding:0 5px;gap:6px;border-bottom:1px solid var(--line)}
#logo{background:var(--fg);color:#000;padding:2px 3px 1px}
#ptn{color:var(--dim)} #ptn b{color:var(--fg);font-weight:400}
#ptn.pend b{animation:blink .25s steps(1) infinite}
#tl{color:var(--line)} #tl.on{color:var(--or)}
#sp{flex:1}
#pl{width:9px;height:9px;position:relative}
#pl:before{content:"";position:absolute;inset:0;background:var(--dim)}
#pl.on:before{background:none;border-left:9px solid var(--or);border-top:5px solid transparent;border-bottom:4px solid transparent;inset:auto;left:0;top:0}
#bpm{font:700 13px/1 "DSEG7",monospace;letter-spacing:1px;min-width:34px;text-align:right}
#beat{width:5px;height:5px;border-radius:50%;background:var(--line)}
#beat.on{background:var(--or);box-shadow:0 0 6px var(--or)}

#scr{display:block;width:240px;height:86px;background:#000}

/* tabs */
#tabs{height:22px;display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:3px;color:var(--dim);border-right:1px solid var(--line);position:relative}
.tab:last-child{border-right:0}
.tab i{width:4px;height:4px;border-radius:50%;background:var(--line);transition:background .25s}
.tab.hit i{background:var(--or);transition:none}
.tab.sel{background:var(--fg);color:#000}
.tab.sel i{background:#000;opacity:.25}
.tab.sel.hit i{background:var(--or);opacity:1}

/* grid */
#grid{height:66px;padding:5px 5px 0;display:grid;grid-template-columns:repeat(8,26px);grid-auto-rows:26px;gap:3px 3px;justify-content:space-between}
.pad{border:1px solid #3a3a3f;position:relative;display:flex;align-items:center;justify-content:center;font-size:11px;color:#000;overflow:hidden}
.pad.q:after{content:"";position:absolute;left:2px;top:2px;width:2px;height:2px;background:var(--dim)}
.pad.on{background:var(--fg);border-color:var(--fg)}
.pad.on.q:after{background:#000}
.pad.ph{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.pad.on.ph{background:var(--or);border-color:var(--or);animation:pop .14s ease-out}
.pad.foc{outline:1px solid var(--bl);outline-offset:1px;animation:focb .5s steps(1) infinite}
.pad.on.foc{background:var(--bl);border-color:var(--bl);color:#fff}
.pad.tap{animation:pop .14s ease-out}
#grid.main{grid-template-columns:repeat(4,54px)}
#grid.main .pad{color:var(--fg)}
#grid.main .pad.on{color:#000}
#grid.main .pad.pend{animation:blinkbg .25s steps(1) infinite}
#grid.main .pad.warn{background:var(--or);border-color:var(--or);color:#000}
@keyframes pop{0%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes focb{50%{outline-color:transparent}}
@keyframes blink{50%{opacity:.2}}
@keyframes blinkbg{50%{background:var(--dim)}}

/* knobs */
#knobs{height:88px;display:flex;padding:0 2px;border-top:1px solid var(--line)}
.kn{flex:1;display:flex;flex-direction:column;align-items:center;padding-top:6px}
.kn .lb{padding:2px 3px 1px;color:var(--dim);white-space:nowrap}
.kn.foc .lb{background:var(--fg);color:#000}
.kn .cap{width:38px;height:38px;border-radius:50%;margin:5px 0 5px;position:relative;background:var(--c);transition:transform .07s linear;box-shadow:0 0 0 3px #000,0 0 0 4px var(--line)}
.kn.foc .cap{box-shadow:0 0 0 3px #000,0 0 0 4px var(--fg)}
.kn .cap:after{content:"";position:absolute;left:17px;top:3px;width:4px;height:13px;background:#000;border-radius:1px}
.kn .cap.bump{animation:bump .12s ease-out}
@keyframes bump{0%{box-shadow:0 0 0 3px #000,0 0 0 7px var(--c)}100%{box-shadow:0 0 0 3px #000,0 0 0 4px var(--fg)}}
.kn .vl{color:var(--fg)}

/* boot */
#boot{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;text-align:center}
#boot h1{font:900 54px/1 "Doto",monospace;margin:0;letter-spacing:1px}
#boot .sub{color:var(--dim);margin-top:4px}
#boot .go{margin-top:22px;background:var(--or);color:#000;padding:4px 6px 3px;animation:blink 1s steps(1) infinite}
#boot .hp{position:absolute;bottom:8px;left:0;right:0;color:var(--dim);line-height:13px}
#boot .hp b{color:var(--fg);font-weight:400}
#boot .bars{display:flex;gap:3px;margin-bottom:14px}
#boot .bars i{width:10px;height:10px;border-radius:50%}
#boot.out{animation:out .28s steps(4) forwards}
@keyframes out{to{transform:translateY(-100%)}}
</style>
</head>
<body>
<div id="app">
  <div id="hd"><span id="logo">KN-1</span><span id="ptn">PTN <b>A</b></span><span id="tl">TILT</span><span id="sp"></span><span id="beat"></span><span id="pl"></span><span id="bpm">120</span></div>
  <canvas id="scr" width="480" height="172"></canvas>
  <div id="tabs"></div>
  <div id="grid"></div>
  <div id="knobs"></div>
  <div id="boot">
    <div class="bars"><i style="background:var(--bl)"></i><i style="background:var(--gr)"></i><i style="background:var(--wh)"></i><i style="background:var(--or)"></i></div>
    <h1>KN-1</h1>
    <div class="sub">POCKET GROOVEBOX</div>
    <div class="go">TAP TO START</div>
    <div class="hp"><b>WHEEL</b> TURN&nbsp; <b>SIDE</b> PLAY/STOP<br><b>HOLD</b> REPEAT&nbsp; <b>TILT</b> FILTER</div>
  </div>
</div>
<script>
(function(){
"use strict";
/* ---------- model ---------- */
var TR=[
 {id:"BD",name:"KICK", kn:["TUNE","DECAY","PUNCH","LEVEL"],def:[.35,.4,.5,.85]},
 {id:"SD",name:"SNARE",kn:["TUNE","DECAY","SNAP","LEVEL"], def:[.4,.35,.6,.7]},
 {id:"HH",name:"HAT",  kn:["TUNE","DECAY","TONE","LEVEL"], def:[.5,.15,.3,.5]},
 {id:"BS",name:"BASS", kn:["WAVE","CUTOFF","DECAY","LEVEL"],def:[0,.35,.35,.75]},
 {id:"LD",name:"LEAD", kn:["WAVE","CUTOFF","DECAY","LEVEL"],def:[1/3,.6,.4,.55]}
];
var MAIN=5, MKN=["TEMPO","SWING","ECHO","VOLUME"];
var KCOL=["var(--bl)","var(--gr)","var(--wh)","var(--or)"], KHEX=["#2f6bff","#17c27a","#f2f0e8","#ff4d14"];
var WAVES=["sawtooth","square","triangle","sine"], WNAME=["SAW","SQR","TRI","SIN"];
var SCALE=[0,2,3,5,7,8,10], NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"], MAXDEG=14;
var PL="ABCD";

function emptyPat(){var on=[],i;for(i=0;i<5;i++)on.push(new Array(16).fill(0));return{on:on,nt:[new Array(16).fill(0),new Array(16).fill(7)]}}
function demoPat(){var p=emptyPat();
 [0,4,8,12].forEach(function(s){p.on[0][s]=1});[4,12].forEach(function(s){p.on[1][s]=1});
 [2,6,10,14,15].forEach(function(s){p.on[2][s]=1});
 [[0,0],[3,0],[6,7],[8,0],[10,2],[11,0],[14,4]].forEach(function(a){p.on[3][a[0]]=1;p.nt[0][a[0]]=a[1]});
 [[0,7],[3,9],[6,11],[10,9],[13,6]].forEach(function(a){p.on[4][a[0]]=1;p.nt[1][a[0]]=a[1]});
 return p}
var S={v:1,bpm:118,swing:.1,echo:.35,vol:.8,pat:0,tilt:false,
 params:TR.map(function(t){return t.def.slice()}),
 pats:[demoPat(),emptyPat(),emptyPat(),emptyPat()]};

var tab=0, focus={type:"knob",i:0}, lastNote=[0,7];
var playing=false, step=0, nextT=0, timer=null, pend=null, uiQ=[], playhead=-1;
var rep={on:false,start:0,n:0,len:2};
var trigAt=[-1e9,-1e9,-1e9,-1e9,-1e9], trigNote=[0,0,0,0,0], hitN=0, beatAt=-1e9;
var tiltX=0, tiltS=0, reel=0, valAt=-1e9;

/* ---------- storage ---------- */
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){
  try{var s=btoa(JSON.stringify(S));
    if(window.creationStorage&&window.creationStorage.plain)window.creationStorage.plain.setItem("kn1",s);
    else localStorage.setItem("kn1",s);}catch(e){}
 },600)}
function load(){
  function use(v){try{var o=JSON.parse(atob(v));if(o&&o.v===1&&o.pats&&o.pats.length===4){S=o;S.tilt=false}}catch(e){}}
  try{
    if(window.creationStorage&&window.creationStorage.plain)
      return Promise.resolve(window.creationStorage.plain.getItem("kn1")).then(function(v){if(v)use(v)}).catch(function(){});
    var v=localStorage.getItem("kn1");if(v)use(v);
  }catch(e){}
  return Promise.resolve();
}

/* ---------- audio ---------- */
var ac=null,bus=[],mix,lpF,hpF,comp,vol,an,scope,dly,dlyOut,noise;
var SEND=[0,.12,.15,.05,.5];
function initAudio(){
  if(ac)return;
  var AC=window.AudioContext||window.webkitAudioContext;ac=new AC();
  mix=ac.createGain();lpF=ac.createBiquadFilter();lpF.type="lowpass";lpF.frequency.value=20000;lpF.Q.value=4;
  hpF=ac.createBiquadFilter();hpF.type="highpass";hpF.frequency.value=20;hpF.Q.value=4;
  comp=ac.createDynamicsCompressor();comp.threshold.value=-10;comp.ratio.value=6;comp.attack.value=.003;comp.release.value=.15;
  vol=ac.createGain();an=ac.createAnalyser();an.fftSize=256;scope=new Uint8Array(an.fftSize);
  mix.connect(lpF);lpF.connect(hpF);hpF.connect(comp);comp.connect(vol);vol.connect(ac.destination);comp.connect(an);
  dly=ac.createDelay(2);var fb=ac.createGain();fb.gain.value=.42;var fl=ac.createBiquadFilter();fl.type="lowpass";fl.frequency.value=2800;
  dlyOut=ac.createGain();dly.connect(fl);fl.connect(fb);fb.connect(dly);fl.connect(dlyOut);dlyOut.connect(mix);
  for(var k=0;k<5;k++){var g=ac.createGain();g.connect(mix);var s=ac.createGain();s.gain.value=SEND[k];g.connect(s);s.connect(dly);bus.push(g)}
  var n=ac.sampleRate,b=ac.createBuffer(1,n,n),d=b.getChannelData(0);for(var i=0;i<n;i++)d[i]=Math.random()*2-1;noise=b;
  applyParams();
}
function applyParams(){
  if(!ac)return;var t=ac.currentTime;
  for(var k=0;k<5;k++){var l=S.params[k][3];bus[k].gain.setTargetAtTime(l*l*1.2,t,.01)}
  vol.gain.setTargetAtTime(S.vol*S.vol*1.3,t,.01);
  dlyOut.gain.setTargetAtTime(S.echo*.9,t,.01);
  dly.delayTime.setTargetAtTime(60/S.bpm/4*3,t,.05);
}
function env(g,t,peak,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(peak,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+d)}
function nsrc(t,d){var s=ac.createBufferSource();s.buffer=noise;s.start(t,Math.random()*.5);s.stop(t+d+.05);return s}
function kick(t){var p=S.params[0],f=38+p[0]*45,d=.12+p[1]*.7,o=ac.createOscillator(),g=ac.createGain();
  o.frequency.setValueAtTime(f*(2+p[2]*8),t);o.frequency.exponentialRampToValueAtTime(f,t+.03+.06*(1-p[2]));
  env(g,t,1,d);o.connect(g);g.connect(bus[0]);o.start(t);o.stop(t+d+.05)}
function snare(t){var p=S.params[1],f=150+p[0]*130,d=.07+p[1]*.35,m=p[2],o=ac.createOscillator(),g=ac.createGain();
  o.type="triangle";o.frequency.setValueAtTime(f*1.6,t);o.frequency.exponentialRampToValueAtTime(f,t+.04);
  env(g,t,(1-m*.7)*.9,d*.6);o.connect(g);g.connect(bus[1]);o.start(t);o.stop(t+d+.05);
  var n=nsrc(t,d),h=ac.createBiquadFilter(),ng=ac.createGain();h.type="highpass";h.frequency.value=1200+p[0]*1500;
  env(ng,t,m*.8+.15,d);n.connect(h);h.connect(ng);ng.connect(bus[1])}
function hat(t){var p=S.params[2],d=.025+p[1]*p[1]*.5,n=nsrc(t,d),h=ac.createBiquadFilter(),g=ac.createGain();
  h.type="highpass";h.frequency.value=6000+p[0]*5000;h.Q.value=1+p[2]*10;env(g,t,.7,d);n.connect(h);h.connect(g);g.connect(bus[2])}
function midiOf(k,deg){return (k===3?33:57)+12*Math.floor(deg/7)+SCALE[deg%7]}
function noteName(k,deg){var m=midiOf(k,deg);return NN[m%12]+(Math.floor(m/12)-1)}
function synth(k,t,deg){var p=S.params[k],wi=Math.round(p[0]*3),f=440*Math.pow(2,(midiOf(k,deg)-69)/12),d=.08+p[2]*.9,
  cut=90*Math.pow(2,p[1]*6.8),fl=ac.createBiquadFilter(),g=ac.createGain(),det=k===4?[-9,9]:[0];
  fl.type="lowpass";fl.Q.value=k===3?7:3;fl.frequency.setValueAtTime(Math.min(cut*5,18000),t);fl.frequency.exponentialRampToValueAtTime(Math.min(cut,18000),t+d*.5);
  env(g,t,(wi>1?.7:.42)/det.length*(k===4?1.3:1),d);fl.connect(g);g.connect(bus[k]);
  det.forEach(function(c){var o=ac.createOscillator();o.type=WAVES[wi];o.frequency.value=f;o.detune.value=c;o.connect(fl);o.start(t);o.stop(t+d+.05)})}
function fire(k,t,deg){if(!ac)return;if(k===0)kick(t);else if(k===1)snare(t);else if(k===2)hat(t);else synth(k,t,deg)}
function preview(k,deg){if(!ac)return;fire(k,ac.currentTime+.005,deg);trigAt[k]=performance.now();trigNote[k]=deg;hitN++}

/* ---------- sequencer ---------- */
function tick(){
  var sd=60/S.bpm/4;
  while(nextT<ac.currentTime+.12){
    if(step===0&&pend!==null&&!rep.on){S.pat=pend;pend=null;uiQ.push({t:nextT,ui:1})}
    var s=step;if(rep.on)s=(rep.start+(rep.n++%rep.len))%16;
    var t=nextT+((s%2)?S.swing*sd*.6:0),P=S.pats[S.pat],tr=[];
    for(var k=0;k<5;k++)if(P.on[k][s]){var dg=k>2?P.nt[k-3][s]:0;fire(k,t,dg);tr.push([k,dg])}
    uiQ.push({s:s,t:t,tr:tr});
    nextT+=sd;step=(step+1)%16;
  }
}
function play(){if(!ac)return;if(ac.state!=="running")ac.resume();playing=true;step=0;rep.on=false;nextT=ac.currentTime+.06;uiQ=[];clearInterval(timer);timer=setInterval(tick,25);tick();hdr()}
function stop(){playing=false;clearInterval(timer);uiQ=[];rep.on=false;setPlayhead(-1);if(pend!==null){S.pat=pend;pend=null;renderGrid()}hdr()}
function toggle(){playing?stop():play()}

/* ---------- knobs ---------- */
function kGet(t,i){if(t===MAIN)return i===0?(S.bpm-60)/140:i===1?S.swing:i===2?S.echo:S.vol;return S.params[t][i]}
function kText(t,i){var v=kGet(t,i);
  if(t===MAIN&&i===0)return ""+S.bpm;
  if(t>2&&t<MAIN&&i===0)return WNAME[Math.round(v*3)];
  return ""+Math.round(v*99)}
function kTurn(t,i,dir,fast){
  var st=(fast?2:1)/40,v;
  if(t===MAIN){
    if(i===0){S.bpm=Math.max(60,Math.min(200,S.bpm+dir*(fast?2:1)))}
    else{v=Math.max(0,Math.min(1,kGet(t,i)+dir*st));if(i===1)S.swing=v;else if(i===2)S.echo=v;else S.vol=v}
  }else if(t>2&&i===0){S.params[t][0]=Math.max(0,Math.min(3,Math.round(S.params[t][0]*3)+dir))/3}
  else S.params[t][i]=Math.max(0,Math.min(1,S.params[t][i]+dir*st));
  applyParams();
}

/* ---------- dom ---------- */
var $=function(id){return document.getElementById(id)};
var elTabs=$("tabs"),elGrid=$("grid"),elKn=$("knobs"),pads=[],tabEls=[],knEls=[];
function buildTabs(){var h="";for(var i=0;i<6;i++)h+='<div class="tab" data-t="'+i+'">'+(i<5?'<i></i>'+TR[i].id:"MAIN")+"</div>";elTabs.innerHTML=h;tabEls=[].slice.call(elTabs.children)}
function buildKnobs(){var h="";for(var i=0;i<4;i++)h+='<div class="kn" data-k="'+i+'" style="--c:'+KCOL[i]+'"><div class="lb"></div><div class="cap"></div><div class="vl"></div></div>';elKn.innerHTML=h;knEls=[].slice.call(elKn.children)}
function renderTabs(){tabEls.forEach(function(e,i){e.classList.toggle("sel",i===tab)})}
function renderKnobs(){knEls.forEach(function(e,i){
  e.classList.toggle("foc",focus.type==="knob"&&focus.i===i);
  e.children[0].textContent=tab===MAIN?MKN[i]:TR[tab].kn[i];
  e.children[1].style.transform="rotate("+(-135+kGet(tab,i)*270)+"deg)";
  e.children[2].textContent=kText(tab,i)})}
function renderGrid(){
  var h="",i;
  if(tab===MAIN){
    elGrid.className="main";
    for(i=0;i<4;i++)h+='<div class="pad'+(S.pat===i?" on":"")+(pend===i?" pend":"")+'" data-m="'+i+'">'+PL[i]+"</div>";
    h+='<div class="pad'+(S.tilt?" on":"")+'" data-m="4">TILT</div><div class="pad" data-m="5">RND</div><div class="pad" data-m="6">COPY</div><div class="pad'+(clrArm?" warn":"")+'" data-m="7">'+(clrArm?"SURE?":"CLR")+"</div>";
  }else{
    elGrid.className="";var P=S.pats[S.pat];
    for(i=0;i<16;i++){var on=P.on[tab][i];
      h+='<div class="pad'+(i%4===0?" q":"")+(on?" on":"")+(focus.type==="step"&&focus.i===i?" foc":"")+(i===playhead?" ph":"")+'" data-s="'+i+'">'+(on&&tab>2?noteName(tab,P.nt[tab-3][i]):"")+"</div>"}
  }
  elGrid.innerHTML=h;pads=[].slice.call(elGrid.children);
}
function setPlayhead(s){
  if(tab!==MAIN){if(playhead>=0&&pads[playhead])pads[playhead].classList.remove("ph");if(s>=0&&pads[s])pads[s].classList.add("ph")}
  playhead=s;
}
function hdr(){$("bpm").textContent=S.bpm;$("pl").className=playing?"on":"";$("ptn").innerHTML="PTN <b>"+PL[pend!==null?pend:S.pat]+"</b>";$("ptn").className=pend!==null?"pend":"";$("tl").className=S.tilt?"on":""}
function all(){renderTabs();renderGrid();renderKnobs();hdr()}

/* ---------- input ---------- */
function selTab(t){tab=t;focus={type:"knob",i:focus.type==="knob"?focus.i:0};all()}
elTabs.addEventListener("pointerdown",function(e){var el=e.target.closest(".tab");if(el)selTab(+el.dataset.t)});
elKn.addEventListener("pointerdown",function(e){var el=e.target.closest(".kn");if(!el)return;focus={type:"knob",i:+el.dataset.k};valAt=performance.now();renderKnobs();if(tab!==MAIN)renderGrid()});
var clrArm=false,clrT=null;
elGrid.addEventListener("pointerdown",function(e){
  var el=e.target.closest(".pad");if(!el)return;
  if(tab===MAIN){mainPad(+el.dataset.m);return}
  var i=+el.dataset.s,P=S.pats[S.pat],on=P.on[tab][i];
  if(tab<3){P.on[tab][i]=on?0:1;if(!on&&!playing)preview(tab,0)}
  else{
    var isF=focus.type==="step"&&focus.i===i;
    if(!on){P.on[tab][i]=1;P.nt[tab-3][i]=lastNote[tab-3];focus={type:"step",i:i};preview(tab,P.nt[tab-3][i])}
    else if(isF){P.on[tab][i]=0;focus={type:"knob",i:0}}
    else{focus={type:"step",i:i};lastNote[tab-3]=P.nt[tab-3][i];preview(tab,P.nt[tab-3][i])}
    valAt=performance.now();renderKnobs();
  }
  renderGrid();if(pads[i])pads[i].classList.add("tap");save();
});
function mainPad(m){
  var P=S.pats[S.pat],k,s;
  if(m<4){if(playing&&m!==S.pat)pend=m;else{S.pat=m;pend=null}}
  else if(m===4){S.tilt=!S.tilt;tiltOn(S.tilt)}
  else if(m===5){
    for(s=0;s<16;s++){
      P.on[0][s]=+(Math.random()<(s%4===0?.92:.1));P.on[1][s]=+(Math.random()<(s%8===4?.92:.07));
      P.on[2][s]=+(Math.random()<(s%2===0?.75:.3));
      P.on[3][s]=+(Math.random()<.42);P.nt[0][s]=[0,0,0,2,3,4,6,7][Math.random()*8|0];
      P.on[4][s]=+(Math.random()<.28);P.nt[1][s]=[0,2,3,4,6,7,9,11][Math.random()*8|0]}
    for(k=0;k<5;k++)trigAt[k]=performance.now()-k*40}
  else if(m===6){var n=(S.pat+1)%4;S.pats[n]=JSON.parse(JSON.stringify(P));if(playing)pend=n;else S.pat=n}
  else if(m===7){
    if(clrArm){S.pats[S.pat]=emptyPat();clrArm=false;clearTimeout(clrT)}
    else{clrArm=true;clearTimeout(clrT);clrT=setTimeout(function(){clrArm=false;if(tab===MAIN)renderGrid()},1600)}}
  if(m!==7)clrArm=false;
  renderGrid();hdr();save();
}
var lastWheel=0;
function wheel(dir){
  var now=performance.now(),fast=now-lastWheel<45;lastWheel=now;valAt=now;
  if(focus.type==="step"&&tab>2&&tab<MAIN){
    var P=S.pats[S.pat],i=focus.i,n=Math.max(0,Math.min(MAXDEG,P.nt[tab-3][i]+dir));
    if(n!==P.nt[tab-3][i]){P.nt[tab-3][i]=n;lastNote[tab-3]=n;if(!playing)preview(tab,n);else{trigNote[tab]=n}
      if(pads[i]){pads[i].textContent=noteName(tab,n)}}
  }else{
    var k=focus.i;kTurn(tab,k,dir,fast);renderKnobs();
    var c=knEls[k].children[1];c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");
    if(tab===MAIN&&k===0)hdr();
  }
  save();
}
function holdStart(){if(playing&&!rep.on){rep.start=playhead>=0?playhead:0;rep.n=0;rep.on=true}}
function holdEnd(){rep.on=false}
window.addEventListener("scrollUp",function(){wheel(1)});
window.addEventListener("scrollDown",function(){wheel(-1)});
window.addEventListener("sideClick",function(){if(!ac)boot();else toggle()});
window.addEventListener("longPressStart",holdStart);
window.addEventListener("longPressEnd",holdEnd);
/* desktop testing: arrows / mouse wheel = wheel, space = side, R = hold */
window.addEventListener("keydown",function(e){if(e.repeat)return;if(e.key==="ArrowUp"||e.key==="ArrowRight")wheel(1);else if(e.key==="ArrowDown"||e.key==="ArrowLeft")wheel(-1);else if(e.key===" "){ac?toggle():boot()}else if(e.key==="r")holdStart()});
window.addEventListener("keyup",function(e){if(e.key==="r")holdEnd()});
window.addEventListener("wheel",function(e){wheel(e.deltaY<0?1:-1)},{passive:true});

/* tilt */
var tiltCb=function(d){if(d&&typeof d.x==="number")tiltX=Math.max(-1,Math.min(1,d.x))};
var dmCb=function(e){var g=e.accelerationIncludingGravity;if(g&&g.x!=null)tiltX=Math.max(-1,Math.min(1,g.x/9.81))};
function tiltOn(on){
