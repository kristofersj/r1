<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>Djursagor</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Top bar: home button, language tabs, page counter -->
    <header class="bar">
      <button id="home" class="icon-btn" aria-label="Hem">
        <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="currentColor" d="M4 0h1v1h1v1h1v1h1v1h1v1H8v4H5V6H4v3H1V5H0V4h1V3h1V2h1V1h1z"/></svg>
      </button>
      <div class="tabs" role="tablist">
        <button class="tab" data-lang="sv" role="tab"><i class="flag se"></i>SV</button>
        <button class="tab" data-lang="fr" role="tab"><i class="flag fr"></i>FR</button>
      </div>
      <div id="counter" class="counter"></div>
    </header>

    <!-- Story picker -->
    <section id="menu" class="view">
      <h1 id="pickTitle"></h1>
      <ul id="list"></ul>
      <p class="hint" id="menuHint"></p>
    </section>

    <!-- Story reader -->
    <section id="reader" class="view hidden">
      <div class="stage">
        <canvas id="scene" width="240" height="148"></canvas>
      </div>
      <div class="textbox">
        <p id="text"></p>
        <div class="foot">
          <span id="speaker" class="speaker" aria-hidden="true">
            <svg viewBox="0 0 11 9" shape-rendering="crispEdges"><path fill="currentColor" d="M0 3h2V2h1V1h1V0h1v9H4V8H3V7H2V6H0z"/><path class="w1" fill="currentColor" d="M7 3h1v3H7z"/><path class="w2" fill="currentColor" d="M9 1h1v1h1v5h-1v1H9V7h1V2H9z"/></svg>
          </span>
          <div id="dots" class="dots"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/stories.js"></script>
  <script src="js/art.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
