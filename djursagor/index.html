<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <base href="https://kristofersj.github.io/r1/djursagor/">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>Djursagor</title>
  <link rel="stylesheet" href="css/style.css?v=6">
</head>
<body>
  <div id="app">
    <!-- Top bar: home button, language tabs, page counter -->
    <header class="bar">
      <button id="home" class="icon-btn" aria-label="Hem">
        <svg viewBox="0 0 9 9" shape-rendering="crispEdges"><path fill="currentColor" d="M4 0h1v1h1v1h1v1h1v1h1v1H8v4H5V6H4v3H1V5H0V4h1V3h1V2h1V1h1z"/></svg>
      </button>
      <div class="tabs" role="tablist">
        <button class="tab" data-lang="sv" role="tab"><i class="flag se"></i>SV</button>
        <button class="tab" data-lang="fr" role="tab"><i class="flag fr"></i>FR</button>
      </div>
      <div id="counter" class="counter"></div>
    </header>

    <!-- Story picker -->
    <section id="menu" class="view">
      <h1 id="pickTitle"></h1>
      <ul id="list"></ul>
      <p class="hint" id="menuHint"></p>
    </section>

    <!-- Story reader -->
    <section id="reader" class="view hidden">
      <div class="stage">
        <canvas id="scene" width="240" height="148"></canvas>
      </div>
      <div class="textbox">
        <p id="text"></p>
        <div class="foot">
          <div id="dots" class="dots"></div>
        </div>
      </div>
    </section>
  </div>

  <script src="js/stories.js?v=6"></script>
  <script src="js/art.js?v=6"></script>
  <script src="js/app.js?v=6"></script>
</body>
</html>
